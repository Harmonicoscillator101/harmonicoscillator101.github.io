# 首页公告栏内容
# ---------------------------------------------------------------------------
# 只列出最近更新的文章，数据源与「时间轴」页一致（site.Params.mainSections）

# 总开关：改为 false 即可整块隐藏
enable: true

# 卡片标题
title: "近期更新"

# 是否显示右上角的关闭按钮
# 注意语义：关闭只隐藏"当前这一次浏览"，刷新页面即重新出现
#（用 sessionStorage 实现，并在离开页面时清除标记）
dismissible: true

# 列出几篇文章（0 = 不显示公告栏）
recent_count: 3
