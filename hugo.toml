baseURL = "https://harmonicoscillator101.github.io/"
locale = "zh-cn"
title = "Harmonicoscillator的个人网站"
theme = "PaperMod"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true
paginate = 15
summaryLength = 140

[params]
  math = true
  # 公式渲染引擎：katex（默认，更快）或 mathjax
  mathEngine = "katex"
  description = "Harmonicoscillator 的个人网站：数学物理学习笔记、等离子体输运理论、量子计算笔记与生活随笔。"
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowWordCounts = true
  ShowLastMod = true
  ShowToc = true
  TocOpen = true
  ShowPostNavLinks = true
  comments = true

[params.giscus]
  repo = 'Harmonicoscillator101/harmonicoscillator101.github.io'
  repoID = 'R_kgDOTl63fA'
  category = 'General'
  categoryID = 'DIC_kwDOTl63fM4DCUFC'
  mapping = 'pathname'
  strict = '0'
  reactionsEnabled = '1'
  emitMetadata = '0'
  inputPosition = 'bottom'
  theme = 'preferred_color_scheme'
  lang = 'zh-CN'
  loading = 'lazy'

[params.busuanzi]
    enable = true

[params.label]
    text = "Harmonicoscillator"
    icon = "/images/mostima.jpg"
    iconHeight = 35

[params.assets]
  # 自定义样式由 layouts/partials/extend_head.html 注入，这里不再重复声明
  # 主图标用 mostima1.jpg；下面三个是浏览器/Touch Icon 会单独请求的尺寸，
  # 已从 mostima1.jpg 居中裁成正方形再缩放（原图 458x478，直接缩放会变形）
  favicon = "/images/mostima1.jpg"
  favicon16x16 = "/images/favicon-16x16.png"
  favicon32x32 = "/images/favicon-32x32.png"
  apple_touch_icon = "/images/apple-touch-icon.png"
  # Safari 固定标签页用单色剪影图标（不设的话会去请求根目录导致 404）
  safari_pinned_tab = "/images/safari-pinned-tab.svg"

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  minMatchCharLength = 1
  keys = ["title", "content", "summary"]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Harmonicoscillator101"

[[params.socialIcons]]
  name = "email"
  url = "mailto:wzykyle101@foxmail.com"

[params.profileMode]
  enabled = true
  title = "初次见面，我是Harmonicoscillator"
  subtitle = """
  你可以翻阅我平时的数学物理学习笔记和一些碎碎念帖子
  """
  imageUrl = "/images/mostima.jpg"
  imageTitle = "我的头像"
  [[params.profileMode.buttons]]
    name = "文章"
    url = "/posts/"
  [[params.profileMode.buttons]]
    name = "生活"
    url = "/life/"
  [[params.profileMode.buttons]]
    name = "关于"
    url = "/about/"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "life"
  name = "生活"
  url = "/life/"
  weight = 15

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 17

[[menu.main]]
  identifier = 'resources'
  name = 'PDF 资料'
  url = '/resources/'
  weight = 18

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "时间轴"
  url = "/archives/"
  weight = 25

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.Search]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]
    [markup.goldmark.renderer]
      unsafe = true
